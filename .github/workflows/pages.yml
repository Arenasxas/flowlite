# Publica la app del celular (mobile/ + shared/) en https://arenasxas.github.io/flowlite/
name: Publicar app del celular
on:
  push:
    branches: [main]
    paths: ["mobile/**", "shared/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r mobile/. _site/
          cp -r shared _site/shared
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
