# Compila la app de Android (android/) y publica FlowLite.apk en Releases.
name: App Android
on:
  push:
    branches: [main]
    paths: ["android/**", "shared/prompts.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Firma (secreto del repo)
        env:
          KS: ${{ secrets.FLOWLITE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/flowlite.p12"
            echo "FLOWLITE_KEYSTORE=$RUNNER_TEMP/flowlite.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto FLOWLITE_KEYSTORE_B64: se firma con una clave de prueba (no se instala encima de la anterior)"
          fi
      - name: Revisar y compilar
        env:
          FLOWLITE_KEY_PASS: ${{ secrets.FLOWLITE_KEY_PASS }}
        run: gradle -p android --no-daemon lintRelease assembleRelease
      - name: Huella de la firma (para Google Cloud)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FlowLite.apk
          "$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner" verify --print-certs FlowLite.apk | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: lint
          path: android/app/build/reports/lint-results-release.html
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ github.run_number }}" FlowLite.apk \
            --title "FlowLite para Android (versión ${{ github.run_number }})" \
            --notes "Bajá FlowLite.apk, abrilo y aceptá «instalar apps desconocidas». Se instala encima de la versión anterior." \
            --latest
